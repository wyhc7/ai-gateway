name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 每天跑一次：README 与部署脚本里的安装地址若指向了不存在的仓库或分支，
  # 只有定时跑才能发现——这类失效不会让构建变红，只会让新用户装不上
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  test:
    name: 后端集成测试 (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: 安装依赖
        run: npm install --prefix server
      - name: 运行测试
        run: npm test --prefix server

  install-links:
    name: 校验文档中的一键安装地址可达
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 提取并检查所有 raw 安装地址
        run: |
          set -uo pipefail
          urls=$(grep -rhoE 'https://raw\.githubusercontent\.com/[A-Za-z0-9._/%-]+' README.md README_EN.md docs/ deploy/ | sort -u)
          if [ -z "$urls" ]; then
            echo "::error::未提取到任何安装地址，请检查文档是否仍在使用一键安装"
            exit 1
          fi
          fail=0
          for url in $urls; do
            code=$(curl -fsS -o "$(mktemp)" -w '%{http_code}' -L --max-time 20 "$url" || echo "000")
            if [ "$code" = "200" ]; then
              echo "OK   $code  $url"
            else
              echo "::error::安装地址不可达 ($code): $url"
              fail=1
            fi
          done
          exit $fail
      - name: 校验 git clone 目标仓库存在
        run: |
          set -uo pipefail
          repos=$(grep -rhoE 'https://github\.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+\.git' README.md README_EN.md docs/ deploy/ | sort -u)
          fail=0
          for repo in $repos; do
            code=$(curl -fsS -o "$(mktemp)" -w '%{http_code}' -L --max-time 20 "${repo%.git}" || echo "000")
            if [ "$code" = "200" ]; then
              echo "OK   $code  $repo"
            else
              echo "::error::仓库不存在或不可访问 ($code): $repo"
              fail=1
            fi
          done
          exit $fail

  docker:
    name: Docker 构建与启动冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 构建镜像（含前端构建）
        run: docker build -t ai-gateway:ci .
      - name: 启动容器并等待健康检查
        run: |
          docker run -d --name gw -p 3001:3001 ai-gateway:ci
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:3001/api/health | grep -q '"ok":true'; then
              echo "健康检查通过"
              docker rm -f gw >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::容器启动后健康检查未通过"
          docker logs gw
          docker rm -f gw >/dev/null
          exit 1
