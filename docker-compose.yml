services:
  ai-gateway:
    build: .
    image: ai-gateway:latest
    container_name: ai-gateway
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATA_DIR=/data
      # 管理界面登录密钥（不设置则自动生成，见容器日志或 /data/config.json）
      # - ADMIN_KEY=change-me
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('node:http');h.get('http://127.0.0.1:3001/api/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
